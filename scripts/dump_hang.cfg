# Дамп зависшего прибора через ST-Link + openocd.
#
# ПОДГОТОВКА: прибор завис (ошибка 00000 / смерть после AUTH), питание НЕ выключать,
# USB не переткать. ST-Link подключен по SWD (SWDIO=PA13, SWCLK=PA14, GND, 3V3).
#
# ЗАПУСК:
#   openocd -f interface/stlink.cfg -f target/stm32f1x.cfg -f dump_hang.cfg
#
# Прислать ВЕСЬ вывод (особенно строки с pc, sp, lr и разделы === ... ===).

reset_config none

init
halt

echo "=== CORE REGISTERS (искать pc / sp / lr) ==="
reg

echo ""
echo "=== FAULT STATUS: CFSR HFSR DFSR MMFAR BFAR AFSR (0xE000ED28) ==="
mdw 0xE000ED28 6

echo ""
echo "=== VM scratch 0x20001400 (16 слов) ==="
mdw 0x20001400 16

echo ""
echo "=== VM table 0x2000D05C (40 слов) ==="
mdw 0x2000D05C 40

echo ""
echo "=== STACK window 0x2000F700..0x2000FA00 (128 слов) ==="
mdw 0x2000F700 128

echo ""
echo "=== STACK window 0x2000FA00..0x2000FC00 (128 слов) ==="
mdw 0x2000FA00 128

echo ""
echo "=== DONE ==="
shutdown
